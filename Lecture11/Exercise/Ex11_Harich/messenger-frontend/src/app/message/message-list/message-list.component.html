<h2>Messages</h2>
<div *ngIf="msgService.isLoading()">Loading...</div>
<div *ngIf="msgService.errorMessage()">{{ msgService.errorMessage() }}</div>

<ul>
  <li *ngFor="let msg of msgService.filteredMessages()">
    <strong>{{ msg.sender }}:</strong> {{ msg.content }}
  </li>
</ul>

<!-- Message input and send -->
<div style="margin-top: 1rem;">
  <input [(ngModel)]="newMessage" placeholder="Type a message..." />
  <button (click)="sendMessage()" [disabled]="!newMessage.trim()">Send</button>
  <button (click)="refreshMessages()">Refresh</button>
</div>
